<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <title>Svatba</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="hero">
        <div class="overlay"></div>

        <div class="hero-content">
            <h1>Kristý & Jirka</h1>
            <p>26.06.2026</p>
        </div>
    </div>

    <audio id="song" src="Hudba/pojdsemnou.mp3"></audio>
    <button class="music-btn" onclick="toggleMusic()">
        <span class="icon music" id="musicIcon">♫</span>
        <span class="icon heart">❤</span>
    </button>

    <script src="script.js"></script>


    <section class="story">
        <!-- Time line navazující pod hero-->

        <!--PRVNÍ FOTKA – PRVNÍ SETKÁNÍ-->
        <h2 class="story-date">06/2023</h2>

        <div class="memory" onclick="toggleMemory(this)">

            <div class="memory-photo">
                <img src="Fotky/memory1.jpeg" alt="Seznámení">
            </div>

            <div class="memory-text">
                <h3>První setkání</h3>

                <p>
                    Hrůza. Jirka oslňuje urážkami, Kristý ne jen, že je zvládá, ale na první dobrou se zamilovává.
                </p>
            </div>

        </div>

        <!--DRUHÁ FOTKA-->
    </section>

</body>

</html>
